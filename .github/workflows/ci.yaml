name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node Environment
        uses: ./.github/setup-node

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  fossa:
    uses: ./.github/workflows/fossa.yaml
    secrets:
      FOSSA_PUB_API_KEY: ${{ secrets.FOSSA_PUB_API_KEY }}

  test-secrets-action:
    name: GitHub Actions Secrets Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-secret-action
        uses: ./secrets
        with:
          api_key: ${{ secrets.GCORE_API_KEY }}
          api_url: ${{ vars.GCORE_API_URL }}
          secret_name: github-local-secret
          secret_value: test-value
          comment: 'Test secret for GitHub Actions CI test'

      - name: Print Output
        id: output
        run: |
          echo "secret_id: ${{ steps.test-secret-action.outputs.secret_id }}"

  test-application-action:
    name: GitHub Actions Deploy-App Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-deploy-app-action
        uses: ./deploy-app
        with:
          api_key: ${{ secrets.GCORE_API_KEY }}
          api_url: ${{ vars.GCORE_API_URL }}
          app_name: 'github-local-app'
          wasm_file: 'public/test.wasm'
          comment: 'Test application for GitHub Actions CI test'

      - name: Print Output
        id: output
        run: |
          echo "app_id: ${{ steps.test-deploy-app-action.outputs.app_id }}"
          echo "binary_id: ${{ steps.test-deploy-app-action.outputs.binary_id }}"

  test-template-action:
    name: GitHub Actions Deploy-Template Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-deploy-template-action
        uses: ./deploy-template
        with:
          api_key: ${{ secrets.GCORE_API_KEY }}
          api_url: ${{ vars.GCORE_API_URL }}
          template_name: 'github-local-template'
          wasm_file: 'public/test.wasm'
          short_descr: 'Test template for GitHub Actions CI test'

      - name: Print Output
        id: output
        run: |
          echo "template_id: ${{ steps.test-deploy-template-action.outputs.template_id }}"
          echo "binary_id: ${{ steps.test-deploy-template-action.outputs.binary_id }}"
